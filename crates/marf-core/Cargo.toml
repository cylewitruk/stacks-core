[package]
name = "marf-core"
version.workspace = true
edition = "2024"
description = "The Merkleized Adaptive Radix Forest (MARF) used by the Stacks blockchain"
license = "GPL-3.0-only"

[lib]
name = "marf_core"
path = "src/lib.rs"

[dependencies]
memmap2 = "0.9"
rusqlite = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }

[target.'cfg(all(any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64"), not(any(target_os="windows"))))'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

[target.'cfg(any(not(any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64")), any(target_os = "windows")))'.dependencies]
sha2 = { version = "0.10.9" }

[dev-dependencies]
# Enable test helpers for this package's integration tests only.
marf-core = {path=".",features=["testing"]}
tempfile = "3"

[features]
default = []
testing = []
profile-sqlite = []
counters = []
