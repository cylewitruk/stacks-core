[package]
name = "stacks-marf-next"
version.workspace = true
edition = "2024"
description = "The Merkleized Adaptive Radix Forest (MARF) used by the Stacks blockchain"
license = "GPL-3.0-only"

[lib]
name = "stacks_marf_next"
path = "src/lib.rs"

[dependencies]
marf-core = {path="../marf-core"}
marf-proofs = {path="../marf-proofs"}
marf-pruning = {path="../marf-pruning"}
serde_json = {workspace=true}
rusqlite = { workspace = true }
slog = { workspace = true }
stacks-common = { path = "../../stacks-common", default-features = false, features = [
    "rusqlite",
] }
stacks-profiler = { workspace = true, optional = true }

[dev-dependencies]
# Enable test helpers for this package's integration tests only.
stacks-marf-next = {path=".",features=["testing"]}
clarity = {path="../../clarity"}
stacks-common = { path = "../../stacks-common", features = [
    "default",
    "testing",
] }
tempfile = "3"

[features]
default = []
# Expose the MARF's test-only helpers to other crates' test suites.
testing = ["stacks-common/testing", "marf-core/testing"]
# SQL timing is observed in core and formatted by this integration.
profile-sqlite = ["stacks-common/profile-sqlite", "marf-core/profile-sqlite"]
# Per-thread operation counters (`stats`) for benchmark experiments; every
# hook compiles to nothing without it.
counters = ["marf-core/counters"]
# `stacks-profiler` spans and records on the same logical operations the
# original MARF instrumented (reads, walks, inserts, seal, flush/commit,
# block-id and record I/O), with the same sampling; `profiler::flags` holds
# the capture toggles stackslib's `profiler` module re-exports.
profiler = ["stacks-profiler"]
