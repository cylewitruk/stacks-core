[package]
name = "marf-differential"
version = "0.1.0"
edition = "2021"
description = "Differential testing harness: replays deterministic operation sequences against the baseline MARF (stackslib) and the rewrite (stacks-marf)"
license = "GPL-3.0-only"
publish = false

[dependencies]
stacks-marf = { path = "../../stacks-marf", features = ["testing"] }
stacks-common = { path = "../../stacks-common", default-features = false, features = ["rusqlite"] }
stacks-marf-next = { path = "../../crates/stacks-marf-next", features = ["testing"] }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
tempfile = "3"

[[bin]]
name = "marf-differential"
path = "src/bin/main.rs"
